- source_dialect: oracle
  source_function: LISTAGG
  category: AGGREGATE
  semantic_function: string_aggregation
  example: SELECT LISTAGG(name, ',') WITHIN GROUP (ORDER BY name) FROM t
  risk_level: medium
  notes: 'targets: LISTAGG (Snowflake/Redshift), STRING_AGG (BigQuery/Postgres/SQLServer),
    ARRAY_JOIN+COLLECT_LIST (Databricks)'
  null_semantics_warning: ''
  timezone_warning: ''
  target_implementations:
    snowflake: LISTAGG(name) WITHIN GROUP (ORDER BY name, ',' NULLS FIRST)
    databricks: LISTAGG(name, ',') WITHIN GROUP (ORDER BY name NULLS LAST, ',')
    bigquery: STRING_AGG(name ORDER BY name, ',')
    redshift: LISTAGG(name ORDER BY name, ',' NULLS FIRST)
    synapse_fabric: STRING_AGG(name, ',') WITHIN GROUP (ORDER BY CASE WHEN name
      IS NULL THEN 1 ELSE 0 END, name, ',')
    postgres: STRING_AGG(name, ',' ORDER BY name, ',' NULLS FIRST)
  automation: automatic
