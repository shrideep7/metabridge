# ==========================================================================
# MetaBridge AI Legacy SQL Function Registry (Phase 3, section 10)
# --------------------------------------------------------------------------
# Semantic function mappings for Oracle / Teradata / SQL Server sources.
# target_implementations are BAKED FROM THE LIVE ENGINE (normalize +
# transpile) — tests pin every automatic entry, so this file cannot
# drift. MANUAL_REVIEW means the engine refuses to guess.
# ==========================================================================

functions:
- source_dialect: oracle
  source_function: NVL
  category: 'NULL'
  semantic_function: null_coalesce
  example: SELECT NVL(a, 0) FROM t
  risk_level: low
  notes: ''
  null_semantics_warning: ''
  timezone_warning: ''
  target_implementations:
    snowflake: COALESCE(a, 0)
    databricks: COALESCE(a, 0)
    bigquery: COALESCE(a, 0)
    redshift: COALESCE(a, 0)
    synapse_fabric: COALESCE(a, 0)
    postgres: COALESCE(a, 0)
  automation: automatic
- source_dialect: oracle
  source_function: NVL2
  category: 'NULL'
  semantic_function: null_branch
  example: SELECT NVL2(a, 'y', 'n') FROM t
  risk_level: low
  notes: NVL2(x, not_null_value, null_value) -> CASE
  null_semantics_warning: ''
  timezone_warning: ''
  target_implementations:
    snowflake: NVL2(a, 'y', 'n')
    databricks: NVL2(a, 'y', 'n')
    bigquery: CASE WHEN NOT a IS NULL THEN 'y' ELSE 'n' END
    redshift: NVL2(a, 'y', 'n')
    synapse_fabric: CASE WHEN NOT a IS NULL THEN 'y' ELSE 'n' END
    postgres: CASE WHEN NOT a IS NULL THEN 'y' ELSE 'n' END
  automation: automatic
- source_dialect: oracle
  source_function: DECODE
  category: CONDITIONAL
  semantic_function: multi_branch_choice
  example: SELECT DECODE(x, 1, 'a', 'b') FROM t
  risk_level: low
  notes: ''
  null_semantics_warning: "DECODE treats NULL = NULL as a MATCH; CASE does not \u2014\
    \ the engine emits IS NULL branches for NULL search values"
  timezone_warning: ''
  target_implementations:
    snowflake: CASE WHEN x = 1 THEN 'a' ELSE 'b' END
    databricks: CASE WHEN x = 1 THEN 'a' ELSE 'b' END
    bigquery: CASE WHEN x = 1 THEN 'a' ELSE 'b' END
    redshift: CASE WHEN x = 1 THEN 'a' ELSE 'b' END
    synapse_fabric: CASE WHEN x = 1 THEN 'a' ELSE 'b' END
    postgres: CASE WHEN x = 1 THEN 'a' ELSE 'b' END
  automation: automatic
- source_dialect: oracle
  source_function: TO_DATE
  category: CONVERSION
  semantic_function: string_to_date
  example: SELECT TO_DATE(s, 'YYYY-MM-DD') FROM t
  risk_level: medium
  notes: format-model differences per target; invalid strings raise on some targets
    and return NULL on others. Databricks/Spark takes the format in its own
    pattern syntax (yyyy-M-d), not Oracle's — the model is translated, not
    dropped, so a non-ISO input string still parses.
  null_semantics_warning: ''
  timezone_warning: ''
  target_implementations:
    snowflake: DATE(s, 'yyyy-mm-DD')
    databricks: TO_DATE(s, 'yyyy-M-d')
    bigquery: PARSE_DATE('%F', s)
    redshift: TO_DATE(s, 'YYYY-MM-DD')
    synapse_fabric: STR_TO_DATE(s, '%Y-%m-%d')
    postgres: TO_DATE(s, 'YYYY-MM-DD')
  automation: automatic
