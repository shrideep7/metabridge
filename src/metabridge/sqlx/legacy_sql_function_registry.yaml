  risk_level: medium
  notes: "SQL Server counts BOUNDARY crossings, not elapsed time \u2014 DATEDIFF(year,'2024-12-31','2025-01-01')\
    \ = 1; verify targets"
  null_semantics_warning: ''
  timezone_warning: ''
  target_implementations:
    snowflake: DATEDIFF(DAY, CAST(d1 AS TIMESTAMP), CAST(d2 AS TIMESTAMP))
    databricks: DATEDIFF(DAY, CAST(d1 AS TIMESTAMP), CAST(d2 AS TIMESTAMP))
    bigquery: DATE_DIFF(CAST(d2 AS DATETIME), CAST(d1 AS DATETIME), DAY)
    redshift: DATEDIFF(DAY, CAST(d1 AS TIMESTAMP), CAST(d2 AS TIMESTAMP))
    synapse_fabric: DATEDIFF(DAY, CAST(d1 AS DATETIME2), CAST(d2 AS DATETIME2))
    postgres: CAST(EXTRACT(epoch FROM CAST(CAST(d2 AS TIMESTAMP) AS TIMESTAMP) -
      CAST(CAST(d1 AS TIMESTAMP) AS TIMESTAMP)) / 86400 AS BIGINT)
  automation: automatic
