# ============================================================================
# MetaBridge AI Informatica Function Conversion Matrix (Phase 2, module 29)
# ----------------------------------------------------------------------------
# Machine-readable catalog of Informatica expression functions. Fields:
#   group             NULL | CONDITIONAL | STRING | DATE | NUMERIC |
#                     CONVERSION | REGEX | ENCODING | HASH | AGGREGATION
#                     (+ STATEFUL for repository-persisted state functions)
#   semantic_function what the function MEANS, engine-agnostically
#   automation_level  full | partial | manual
#   semantic_risk     none | low | medium | high
#   expected_sql      canonical conversion, PINNED to the live engine
#   dbt_default       SQL emitted into dbt models (canonical dialect)
#   databricks_sql    the same conversion transpiled to Databricks SQL
# Conversion is AST-based (sqlx.expressions) — never string replacement.
# Every supported entry is verified by tests against the live engine, so
# this file cannot drift. manual entries raise ExpressionError and route
# the owning port to the manual queue — never silently dropped.
# ============================================================================

