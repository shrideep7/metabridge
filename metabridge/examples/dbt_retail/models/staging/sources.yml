version: 2

sources:
  - name: raw
    schema: RAW
    database: RETAIL_DB
    tables:
      - name: raw_customers
        columns:
          - name: id
            data_type: integer
          - name: first_name
            data_type: varchar(100)
          - name: last_name
            data_type: varchar(100)
          - name: email
            data_type: varchar(255)
          - name: status
            data_type: varchar(20)
          - name: created_at
            data_type: timestamp
      - name: raw_orders
        columns:
          - name: order_id
            data_type: integer
          - name: customer_id
            data_type: integer
          - name: order_date
            data_type: date
          - name: order_status
            data_type: varchar(20)
          - name: amount
            data_type: decimal(18,2)
          - name: updated_at
            data_type: timestamp
