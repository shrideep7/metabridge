# ============================================================================
# MetaBridge AI PowerCenter Transformation Semantic Registry
# ----------------------------------------------------------------------------
# The single declared source of PowerCenter-transformation conversion
# knowledge. Application code resolves transformations through
# parsers.pc_registry.PCTransformationRegistry — transformation logic is
# never scattered through source code.
#
# Per entry:
#   powercenter_type        display name as PowerCenter calls it
#   aliases                 TYPE strings seen in real POWERMART exports
#   cir_type                canonical semantic classification
#   automation_level        FULL | HIGH | PARTIAL | LOW | MANUAL
#   dbt_strategy            how it lands in a dbt project
#   databricks_strategy     how it lands on Databricks
#   requires_manual_review  true when a human must sign off
#   semantic_handler        dispatch id in the conversion engine
#   row_semantics           passive | active | generator | boundary
#   native_in_engine        true = the MetaBridge AI parser/generators convert
#                           it today; false = registry-guided manual queue
#   notes / workaround      honest migration guidance
#
# automation_level meaning:
#   FULL     converts without assumptions
#   HIGH     converts; documented assumptions (verify flagged items)
#   PARTIAL  core converts; edge semantics need review
#   LOW      skeleton/strategy generated; logic ported by hand
#   MANUAL   no automated equivalent; workaround documented
# ============================================================================

