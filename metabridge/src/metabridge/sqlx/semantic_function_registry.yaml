# ============================================================================
# MetaBridge AI Semantic Function Registry
# ----------------------------------------------------------------------------
# The single source of truth for semantic-function -> platform-function
# knowledge. Nothing in application code may hardcode these mappings; code
# loads this file through sqlx.registry.FunctionRegistry.
#
# Entry format:
#   SEMANTIC_NAME:
#     category: one of the registry categories
#     description: what the function MEANS (intent, not syntax)
#     args: [argument names]           # documentation of the argument order
#     platforms:
#       <platform>: "NAME"             # plain function -> NAME(arg0, arg1, ...)
#       <platform>: "TPL({0}, {1})"    # template -> formatted with args
#       <platform>:                    # honest gap
#         unsupported: true
#         workaround: "how a human ports it"
#
# Platforms: oracle, snowflake, databricks, bigquery, redshift, synapse,
#            sqlserver, postgres, teradata, ansi, informatica
# 'ansi' is mandatory for every function (the canonical rendering).
# ============================================================================

# ---------------------------------------------------------------------------
# NULL FUNCTIONS
# ---------------------------------------------------------------------------
NULL_COALESCE:
  category: "null"
  description: "First non-null value of the arguments"
  args: [value, fallback]
  platforms:
    oracle: "NVL"
    snowflake: "COALESCE"
    databricks: "COALESCE"
    bigquery: "COALESCE"
    redshift: "COALESCE"
    synapse: "COALESCE"
    sqlserver: "COALESCE"        # ISNULL(a,b) also valid for 2 args
    postgres: "COALESCE"
    teradata: "COALESCE"
    ansi: "COALESCE"
    informatica: "IIF(ISNULL({0}), {1}, {0})"

NULL_IF:
  category: "null"
  description: "NULL when the two arguments are equal, else the first"
  args: [value, match]
  platforms:
    oracle: "NULLIF"
    snowflake: "NULLIF"
    databricks: "NULLIF"
    bigquery: "NULLIF"
    redshift: "NULLIF"
    synapse: "NULLIF"
    sqlserver: "NULLIF"
    postgres: "NULLIF"
    teradata: "NULLIF"
    ansi: "NULLIF"
    informatica: "IIF({0} = {1}, NULL, {0})"

IS_NULL_CHECK:
  category: "null"
  description: "Boolean test: is the value NULL"
  args: [value]
  platforms:
    oracle: "{0} IS NULL"
    snowflake: "{0} IS NULL"
    databricks: "{0} IS NULL"
    bigquery: "{0} IS NULL"
    redshift: "{0} IS NULL"
    synapse: "{0} IS NULL"
    sqlserver: "{0} IS NULL"
    postgres: "{0} IS NULL"
    teradata: "{0} IS NULL"
    ansi: "{0} IS NULL"
    informatica: "ISNULL({0})"

ZERO_IF_NULL:
  category: "null"
  description: "Value, or zero when NULL"
  args: [value]
  platforms:
    oracle: "NVL({0}, 0)"
    snowflake: "ZEROIFNULL"
    databricks: "COALESCE({0}, 0)"
    bigquery: "COALESCE({0}, 0)"
    redshift: "COALESCE({0}, 0)"
    synapse: "COALESCE({0}, 0)"
    sqlserver: "ISNULL({0}, 0)"
    postgres: "COALESCE({0}, 0)"
    teradata: "ZEROIFNULL"
    ansi: "COALESCE({0}, 0)"
    informatica: "IIF(ISNULL({0}), 0, {0})"

# ---------------------------------------------------------------------------
# CONDITIONAL FUNCTIONS
# ---------------------------------------------------------------------------
CONDITIONAL:
  category: conditional
  description: "If condition then A else B"
  args: [condition, then_value, else_value]
  platforms:
    oracle: "CASE WHEN {0} THEN {1} ELSE {2} END"
    snowflake: "IFF({0}, {1}, {2})"
    databricks: "IF({0}, {1}, {2})"
    bigquery: "IF({0}, {1}, {2})"
    redshift: "CASE WHEN {0} THEN {1} ELSE {2} END"
    synapse: "IIF({0}, {1}, {2})"
    sqlserver: "IIF({0}, {1}, {2})"
    postgres: "CASE WHEN {0} THEN {1} ELSE {2} END"
    teradata: "CASE WHEN {0} THEN {1} ELSE {2} END"
    ansi: "CASE WHEN {0} THEN {1} ELSE {2} END"
    informatica: "IIF({0}, {1}, {2})"

VALUE_MAP:
  category: conditional
  description: "Map a value through pairs (simple CASE / DECODE)"
  args: [value, search1, result1, default]
  platforms:
    oracle: "DECODE"
    snowflake: "DECODE"
    databricks: "CASE {0} WHEN {1} THEN {2} ELSE {3} END"
    bigquery: "CASE {0} WHEN {1} THEN {2} ELSE {3} END"
    redshift: "DECODE"
    synapse: "CASE {0} WHEN {1} THEN {2} ELSE {3} END"
    sqlserver: "CASE {0} WHEN {1} THEN {2} ELSE {3} END"
    postgres: "CASE {0} WHEN {1} THEN {2} ELSE {3} END"
    teradata: "CASE {0} WHEN {1} THEN {2} ELSE {3} END"
    ansi: "CASE {0} WHEN {1} THEN {2} ELSE {3} END"
    informatica: "DECODE"

GREATEST_VALUE:
  category: conditional
  description: "Largest of the arguments"
  args: [values...]
  platforms:
    oracle: "GREATEST"
    snowflake: "GREATEST"
    databricks: "GREATEST"
    bigquery: "GREATEST"
    redshift: "GREATEST"
    synapse:
      unsupported: true
      workaround: "Use a CASE expression or (SELECT MAX(v) FROM (VALUES ...))"
    sqlserver: "GREATEST"        # SQL Server 2022+
    postgres: "GREATEST"
    teradata: "GREATEST"
    ansi: "GREATEST"
    informatica: "GREATEST"

LEAST_VALUE:
  category: conditional
  description: "Smallest of the arguments"
  args: [values...]
  platforms:
    oracle: "LEAST"
    snowflake: "LEAST"
    databricks: "LEAST"
    bigquery: "LEAST"
    redshift: "LEAST"
    synapse:
      unsupported: true
      workaround: "Use a CASE expression or (SELECT MIN(v) FROM (VALUES ...))"
    sqlserver: "LEAST"           # SQL Server 2022+
    postgres: "LEAST"
    teradata: "LEAST"
    ansi: "LEAST"
    informatica: "LEAST"

# ---------------------------------------------------------------------------
# DATE FUNCTIONS
# ---------------------------------------------------------------------------
CURRENT_DATE_VALUE:
  category: date
  description: "Today's date (no time component)"
  args: []
  platforms:
    oracle: "TRUNC(SYSDATE)"
    snowflake: "CURRENT_DATE()"
    databricks: "CURRENT_DATE()"
    bigquery: "CURRENT_DATE()"
    redshift: "CURRENT_DATE"
    synapse: "CAST(GETDATE() AS DATE)"
    sqlserver: "CAST(GETDATE() AS DATE)"
    postgres: "CURRENT_DATE"
    teradata: "CURRENT_DATE"
    ansi: "CURRENT_DATE"
    informatica: "TRUNC(SYSDATE)"

CURRENT_DATETIME:
  category: timestamp
  description: "Current date and time"
  args: []
  platforms:
    oracle: "SYSDATE"
    snowflake: "CURRENT_TIMESTAMP()"
    databricks: "CURRENT_TIMESTAMP()"
    bigquery: "CURRENT_TIMESTAMP()"
    redshift: "GETDATE()"
    synapse: "GETDATE()"
    sqlserver: "GETDATE()"
    postgres: "CURRENT_TIMESTAMP"
    teradata: "CURRENT_TIMESTAMP"
    ansi: "CURRENT_TIMESTAMP"
    informatica: "SYSDATE"

DATE_ADD_INTERVAL:
  category: date
  description: "Add N units to a date/timestamp"
  args: [date, unit, amount]
  platforms:
    oracle: "{0} + INTERVAL '{2}' {1}"
    snowflake: "DATEADD({1}, {2}, {0})"
    databricks: "DATEADD({1}, {2}, {0})"
    bigquery: "DATE_ADD({0}, INTERVAL {2} {1})"
    redshift: "DATEADD({1}, {2}, {0})"
    synapse: "DATEADD({1}, {2}, {0})"
    sqlserver: "DATEADD({1}, {2}, {0})"
    postgres: "{0} + INTERVAL '{2} {1}'"
    teradata: "{0} + INTERVAL '{2}' {1}"
    ansi: "{0} + INTERVAL '{2}' {1}"
    informatica: "ADD_TO_DATE({0}, '{1}', {2})"

DATE_DIFF_INTERVAL:
  category: date
  description: "Difference between two dates in units (end - start)"
  args: [unit, start, end]
  platforms:
    oracle: "({2} - {1})"        # days; other units need EXTRACT arithmetic
    snowflake: "DATEDIFF({0}, {1}, {2})"
    databricks: "DATEDIFF({0}, {1}, {2})"
    bigquery: "DATE_DIFF({2}, {1}, {0})"
    redshift: "DATEDIFF({0}, {1}, {2})"
    synapse: "DATEDIFF({0}, {1}, {2})"
    sqlserver: "DATEDIFF({0}, {1}, {2})"
    postgres: "EXTRACT(EPOCH FROM ({2} - {1}))"
    teradata: "({2} - {1})"
    ansi: "({2} - {1})"
    informatica: "DATE_DIFF({2}, {1}, '{0}')"

DATE_TRUNCATE:
  category: date
  description: "Truncate a date/timestamp to a unit boundary"
  args: [unit, value]
  platforms:
    oracle: "TRUNC({1}, '{0}')"
    snowflake: "DATE_TRUNC('{0}', {1})"
    databricks: "DATE_TRUNC('{0}', {1})"
    bigquery: "DATE_TRUNC({1}, {0})"
    redshift: "DATE_TRUNC('{0}', {1})"
    synapse: "DATETRUNC({0}, {1})"
    sqlserver: "DATETRUNC({0}, {1})"     # SQL Server 2022+
    postgres: "DATE_TRUNC('{0}', {1})"
    teradata: "TRUNC({1}, '{0}')"
    ansi: "DATE_TRUNC('{0}', {1})"
    informatica: "TRUNC({1}, '{0}')"

DATE_PART_EXTRACT:
  category: date
  description: "Extract a component (year/month/day/...) from a date"
  args: [unit, value]
  platforms:
    oracle: "EXTRACT({0} FROM {1})"
    snowflake: "DATE_PART('{0}', {1})"
    databricks: "EXTRACT({0} FROM {1})"
    bigquery: "EXTRACT({0} FROM {1})"
    redshift: "DATE_PART('{0}', {1})"
    synapse: "DATEPART({0}, {1})"
    sqlserver: "DATEPART({0}, {1})"
    postgres: "EXTRACT({0} FROM {1})"
    teradata: "EXTRACT({0} FROM {1})"
    ansi: "EXTRACT({0} FROM {1})"
    informatica: "GET_DATE_PART({1}, '{0}')"

LAST_DAY_OF_MONTH:
  category: date
  description: "Last day of the month containing the date"
  args: [value]
  platforms:
    oracle: "LAST_DAY"
    snowflake: "LAST_DAY"
    databricks: "LAST_DAY"
    bigquery: "LAST_DAY"
    redshift: "LAST_DAY"
    synapse: "EOMONTH"
    sqlserver: "EOMONTH"
    postgres: "(DATE_TRUNC('month', {0}) + INTERVAL '1 month - 1 day')::date"
    teradata: "LAST_DAY"
    ansi: "LAST_DAY"
    informatica: "LAST_DAY"

DATE_FORMAT_TO_STRING:
  category: date
  description: "Format a date/timestamp as a string with a mask"
  args: [value, format_mask]
  platforms:
    oracle: "TO_CHAR"
    snowflake: "TO_CHAR"
    databricks: "DATE_FORMAT"
    bigquery: "FORMAT_TIMESTAMP({1}, {0})"
    redshift: "TO_CHAR"
    synapse: "FORMAT"
    sqlserver: "FORMAT"
    postgres: "TO_CHAR"
    teradata: "TO_CHAR"
    ansi: "TO_CHAR"
    informatica: "TO_CHAR({0}, {1})"

STRING_TO_DATE:
  category: date
  description: "Parse a string into a date with a mask"
  args: [value, format_mask]
  platforms:
    oracle: "TO_DATE"
    snowflake: "TO_DATE"
    databricks: "TO_DATE"
    bigquery: "PARSE_DATE({1}, {0})"
    redshift: "TO_DATE"
    synapse: "CONVERT(DATE, {0})"
    sqlserver: "CONVERT(DATE, {0})"
    postgres: "TO_DATE"
    teradata: "TO_DATE"
    ansi: "TO_DATE"
    informatica: "TO_DATE({0}, {1})"

EPOCH_TO_TIMESTAMP:
  category: timestamp
  description: "Convert unix epoch seconds to a timestamp"
  args: [epoch_seconds]
  platforms:
    oracle: "TO_DATE('1970-01-01','YYYY-MM-DD') + {0}/86400"
    snowflake: "TO_TIMESTAMP({0})"
    databricks: "FROM_UNIXTIME({0})"
    bigquery: "TIMESTAMP_SECONDS({0})"
    redshift: "TIMESTAMP 'epoch' + {0} * INTERVAL '1 second'"
    synapse: "DATEADD(second, {0}, '1970-01-01')"
    sqlserver: "DATEADD(second, {0}, '1970-01-01')"
    postgres: "TO_TIMESTAMP({0})"
    teradata:
      unsupported: true
      workaround: "CAST(DATE '1970-01-01' AS TIMESTAMP) + ({0} * INTERVAL '1' SECOND)"
    ansi: "TO_TIMESTAMP({0})"
    informatica: "ADD_TO_DATE(TO_DATE('1970-01-01','YYYY-MM-DD'), 'SS', {0})"

