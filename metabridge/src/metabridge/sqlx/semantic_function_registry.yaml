      workaround: "STRING_SPLIT + ROW_NUMBER, or PARSENAME for <=4 fields"
    postgres: "SPLIT_PART"
    teradata: "STRTOK({0}, {1}, {2})"
    ansi: "SPLIT_PART"
    informatica:
