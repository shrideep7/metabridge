TYPE_CAST:
  category: conversion
  description: "Convert a value to a type (error on failure)"
  args: [value, type]
  platforms:
    oracle: "CAST({0} AS {1})"
    snowflake: "CAST({0} AS {1})"
    databricks: "CAST({0} AS {1})"
    bigquery: "CAST({0} AS {1})"
    redshift: "CAST({0} AS {1})"
    synapse: "CAST({0} AS {1})"
    sqlserver: "CAST({0} AS {1})"
    postgres: "CAST({0} AS {1})"
    teradata: "CAST({0} AS {1})"
    ansi: "CAST({0} AS {1})"
    informatica: "TO_CHAR/TO_DECIMAL/TO_DATE by target type"

TYPE_SAFE_CAST:
  category: conversion
  description: "Convert to a type, NULL on failure (never errors)"
  args: [value, type]
  platforms:
    oracle:
      unsupported: true
      workaround: "CAST({0} AS {1} DEFAULT NULL ON CONVERSION ERROR) (12.2+)"
    snowflake: "TRY_CAST({0} AS {1})"
    databricks: "TRY_CAST({0} AS {1})"
    bigquery: "SAFE_CAST({0} AS {1})"
    redshift:
      unsupported: true
      workaround: "CASE WHEN can_cast THEN CAST(...) END or COPY error handling"
    synapse: "TRY_CAST({0} AS {1})"
    sqlserver: "TRY_CAST({0} AS {1})"
    postgres:
      unsupported: true
      workaround: "Custom function with EXCEPTION block"
    teradata: "TRYCAST({0} AS {1})"
    ansi: "TRY_CAST({0} AS {1})"
    informatica:
      unsupported: true
      workaround: "IS_NUMBER/IS_DATE guard + conversion"

TO_NUMBER_CONVERSION:
  category: conversion
  description: "Parse a string into a number"
  args: [value]
  platforms:
